# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create Firebase config file
        run: |
          cat > src/environments/firebase.config.ts <<EOF
          export interface FirebaseConfigPlaceholder {
            apiKey: string;
            authDomain: string;
            projectId: string;
            storageBucket: string;
            messagingSenderId: string;
            appId: string;
            measurementId?: string;
          }

          export const firebaseConfig: FirebaseConfigPlaceholder = {
            apiKey: '${{ vars.FIREBASE_API_KEY }}',
            authDomain: '${{ vars.FIREBASE_AUTH_DOMAIN }}',
            projectId: '${{ vars.FIREBASE_PROJECT_ID }}',
            storageBucket: '${{ vars.FIREBASE_STORAGE_BUCKET }}',
            messagingSenderId: '${{ vars.FIREBASE_MESSAGING_SENDER_ID }}',
            appId: '${{ vars.FIREBASE_APP_ID }}',
            measurementId: '${{ vars.FIREBASE_MEASUREMENT_ID }}'
          };
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMMUNITYPORTAL_DEEFE }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}