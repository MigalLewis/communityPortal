<header class="topbar">
  <a class="brand" routerLink="/" aria-label="PNRA website home">PNRA</a>

  <nav class="top-nav" aria-label="Primary">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        {{ item.label }}
      </a>
    }
    @if (auth.isAuthenticated() && auth.authUser()?.claims?.admin) {
      <a routerLink="/admin" routerLinkActive="is-active" class="nav-link">Administration</a>
    }
  </nav>

  <div class="topbar-actions">
    <a class="website-link" routerLink="/">Main website</a>
  </div>
</header>
