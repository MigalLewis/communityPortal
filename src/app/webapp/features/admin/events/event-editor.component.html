<section class="editor"><a routerLink="/admin/events">← Events</a><h1>{{ loading() ? 'Loading event…' : (form.value.title ? 'Edit event' : 'Create event') }}</h1>@if(error()){<p class="error" role="alert">{{error()}}</p>}
@if(!loading()){<form [formGroup]="form" (ngSubmit)="save()"><label>Title<input formControlName="title"></label><label>Slug<input formControlName="slug" placeholder="community-market-day"></label><label>Summary<textarea formControlName="summary"></textarea></label><label>Description<textarea rows="7" formControlName="description"></textarea></label><div class="row"><label>Category<input formControlName="category"></label><label>Venue<input formControlName="venue"></label></div><div class="row"><label>Starts<input type="datetime-local" formControlName="startAt"></label><label>Ends<input type="datetime-local" formControlName="endAt"></label></div><label>Image URL<input type="url" formControlName="imageUrl"></label><label>Image alternative text<input formControlName="imageAlt"></label><label>Image caption<input formControlName="imageCaption"></label><label class="check"><input type="checkbox" formControlName="featured"> Featured event</label><button type="submit" [disabled]="saving()">{{saving()?'Saving…':'Save event'}}</button></form>}</section>
