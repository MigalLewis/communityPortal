<section class="editor"><a routerLink="/admin/projects">← Community projects</a><h1>{{ loading() ? 'Loading project…' : (form.value.title ? 'Edit community project' : 'Create community project') }}</h1>@if(error()){<p class="error" role="alert">{{error()}}</p>}
@if(!loading()){<form [formGroup]="form" (ngSubmit)="save()"><label>Title<input formControlName="title"></label><label>Slug<input formControlName="slug" placeholder="pocket-park"></label><label>Summary<textarea rows="3" formControlName="summary"></textarea></label><label>Full content<textarea rows="10" formControlName="content"></textarea></label><div class="row"><label>Category<input formControlName="category" placeholder="Environment"></label><label>Lifecycle status<select formControlName="status"><option value="planned">Planned</option><option value="active">Active</option><option value="on_hold">On hold</option><option value="completed">Completed</option><option value="archived">Archived</option></select></label></div><div class="row"><label>Progress (%)<input type="number" min="0" max="100" step="1" formControlName="progress"></label><label class="check"><input type="checkbox" formControlName="featured"> Featured project</label></div><div class="row"><label>Project start date<input type="date" formControlName="startDate"></label><label>Project completion date<input type="date" formControlName="completionDate"></label></div><label>Publication mode<select formControlName="publicationMode"><option value="manual">Manual</option><option value="scheduled">Time based</option></select></label>@if(form.controls.publicationMode.value === 'scheduled'){<div class="row"><label>Visible from<input type="datetime-local" formControlName="visibleFrom" required></label><label>Visible until<input type="datetime-local" formControlName="visibleUntil" required></label></div>}<label>Image URL<input type="url" formControlName="imageUrl"></label><label>Image alternative text<input formControlName="imageAlt"></label><label>Image caption<input formControlName="imageCaption"></label><button type="submit" [disabled]="saving()">{{saving()?'Saving…':'Save project'}}</button></form>}</section>
